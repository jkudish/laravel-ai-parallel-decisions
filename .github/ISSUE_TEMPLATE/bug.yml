name: Bug report
description: Report a reproducible problem with the package
title: "[Bug]: "
labels: ["bug"]
body:
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Describe what you expected and what happened instead. Include the exception class and `rule` if one was thrown.
      validations:
          required: true
    - type: textarea
      id: how-to-reproduce
      attributes:
          label: How to reproduce it
          description: The smallest `Classification::of()` call that shows the problem, and your provider config with the API key removed. Add the `decisionId` if Parallel returned one.
      validations:
          required: true
    - type: input
      id: package-version
      attributes:
          label: Package version
          description: Run `composer show jkudish/laravel-ai-parallel-decisions`.
          placeholder: 0.1.0
      validations:
          required: true
    - type: input
      id: laravel-ai-version
      attributes:
          label: laravel/ai version
          description: Run `composer show laravel/ai`.
          placeholder: 1.3.0
      validations:
          required: true
    - type: input
      id: php-version
      attributes:
          label: PHP version
          placeholder: 8.4.0
      validations:
          required: true
    - type: input
      id: laravel-version
      attributes:
          label: Laravel version
          placeholder: 13.0.0
      validations:
          required: true
    - type: textarea
      id: notes
      attributes:
          label: Logs and notes
          description: Remove API keys and any private data from logs before pasting them.
      validations:
          required: false
