name: Feature request
description: Propose an improvement to Laravel AI Parallel Decisions
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or classification problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include provider documentation, sample payloads, or usage-unit semantics when relevant. Do not include credentials or private workload data.
