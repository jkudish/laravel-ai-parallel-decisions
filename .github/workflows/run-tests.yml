name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            stability: prefer-lowest
            os: ubuntu-latest
          - php: '8.4'
            stability: prefer-stable
            os: windows-latest
          - php: '8.5'
            stability: prefer-stable
            os: ubuntu-latest
          - php: '8.5'
            stability: prefer-stable
            os: windows-latest

    name: PHP ${{ matrix.php }} / ${{ matrix.stability }} / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --ci

  laravel-12-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo
          coverage: none

      - name: Create a clean Laravel 12 consumer
        run: composer create-project laravel/laravel:^12 consumer --no-interaction --prefer-dist

      - name: Install the package without its Pest 5 development dependencies
        working-directory: consumer
        run: |
          composer config repositories.decisions '{"type":"path","url":"..","options":{"symlink":false}}'
          composer require jkudish/laravel-ai-parallel-decisions:@dev --no-interaction

      - name: Verify package discovery and driver registration
        working-directory: consumer
        run: |
          php artisan package:discover --ansi
          php artisan tinker --execute="echo get_class(app(Laravel\Ai\AiManager::class)->classificationProvider('parallel'));" | grep 'ParallelDecisionsProvider'
